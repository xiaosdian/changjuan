name: Build LongShot IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Developer Directory ==="
          xcode-select -p

          echo "=== SDKs ==="
          xcodebuild -showsdks

      - name: Show project information
        run: |
          xcodebuild \
            -project LongShot.xcodeproj \
            -list

      - name: Build unsigned app
        run: |
          mkdir -p build

          xcodebuild \
            -project LongShot.xcodeproj \
            -scheme LongShot \
            -configuration Release \
            -sdk iphoneos27.1 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Find LongShot.app
        run: |
          echo "=== Searching for LongShot.app ==="

          find build/DerivedData \
            -type d \
            -name "LongShot.app" \
            -print

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData \
            -type d \
            -name "LongShot.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "::error::LongShot.app not found"
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          mkdir -p build/Payload

          cp -R "$APP_PATH" \
            build/Payload/LongShot.app

          cd build

          zip -r LongShot-unsigned.ipa Payload

          echo ""
          echo "=== IPA ==="
          ls -lh LongShot-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LongShot-unsigned-IPA
          path: build/LongShot-unsigned.ipa
          if-no-files-found: error
